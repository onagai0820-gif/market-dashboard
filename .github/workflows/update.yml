name: 市場データ更新

on:
  schedule:
    # FRED・ECB とも1日1回の更新なので、各市場の終値が出そろう時間帯に取りに行く。
    # UTC 指定（JST = UTC+9）。
    - cron: "20 22 * * 1-6"
    - cron: "20 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: データ取得
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: python scripts/build_data.py

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 市場データを更新 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
